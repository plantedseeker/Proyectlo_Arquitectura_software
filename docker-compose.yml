services:
  db:
    image: postgres:16.14-alpine
    environment:
      POSTGRES_DB: utrabajo
      POSTGRES_USER: utrabajo
      POSTGRES_PASSWORD: utrabajo_local
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U utrabajo -d utrabajo"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  api:
    build:
      context: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/utrabajo
      DB_USER: utrabajo
      DB_PASSWORD: utrabajo_local
      PUBLIC_BASE_URL: http://10.0.2.2:8080
      SEED_DEMO: "true"
      INTEGRATION_TOKEN: ${INTEGRATION_TOKEN:-spike-local-token}
      MESSAGE_CACHE_ENABLED: ${MESSAGE_CACHE_ENABLED:-false}
      MESSAGE_CACHE_TTL_MS: ${MESSAGE_CACHE_TTL_MS:-1000}
      MESSAGE_CACHE_MAX_ENTRIES: ${MESSAGE_CACHE_MAX_ENTRIES:-1000}
    ports:
      - "8080:8080"
    volumes:
      - upload_data:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  k6:
    image: grafana/k6:0.54.0
    profiles: ["load"]
    environment:
      BASE_URL: http://api:8080
      CHAT_ID: 3fb4ce25-b840-4685-d2ea-53f9a4bdedc6
      INTEGRATION_TOKEN: ${INTEGRATION_TOKEN:-spike-local-token}
    volumes:
      - ./experimentos/medicion-escenario-01:/experiment
      - ./experimentos/spike-01-integracion:/spike
      - ./experimentos/crecimiento-mensajeria:/growth
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  upload_data:
