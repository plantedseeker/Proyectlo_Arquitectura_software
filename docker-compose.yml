services:
  db:
    image: postgres:16.14-alpine
    environment:
      POSTGRES_DB: utrabajo
      POSTGRES_USER: utrabajo
      POSTGRES_PASSWORD: utrabajo_local
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U utrabajo -d utrabajo"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  api:
    build:
      context: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/utrabajo
      DB_USER: utrabajo
      DB_PASSWORD: utrabajo_local
      PUBLIC_BASE_URL: http://10.0.2.2:8080
      SEED_DEMO: "true"
    ports:
      - "8080:8080"
    volumes:
      - upload_data:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 15
    restart: unless-stopped

volumes:
  postgres_data:
  upload_data:
